name: CardioSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app ml tests

      - name: Run API tests
        run: pytest -q

      - name: API route smoke check
        run: |
          python - <<'PY'
          from app.main import app
          routes = {route.path for route in app.routes}
          required = {"/", "/api/v1/health"}
          missing = required - routes
          if missing:
              raise SystemExit(f"Missing required routes: {sorted(missing)}")
          print("CardioSense API route smoke check passed")
          PY
